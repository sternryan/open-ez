<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Long-EZ build lab</title>
</head>
<body>
  <div id="app"><canvas id="gl" tabindex="0" aria-label="3D view of the canard in the workshop"></canvas><div id="labels" aria-hidden="true"></div></div>

  <aside id="controls" class="card" aria-label="View controls">
    <div class="group">
      <span class="label">Canard</span>
      <div id="variant" class="seg" role="group" aria-label="Canard variant">
        <button type="button" data-variant="roncz" aria-pressed="true">Roncz</button>
        <button type="button" data-variant="gu" aria-pressed="false">GU</button>
      </div>
    </div>
    <div class="group">
      <span class="label">View</span>
      <button type="button" id="home" class="btn">Home view</button>
    </div>
    <div class="group" id="scrubwrap" hidden>
      <span class="label" id="scrublabel">Ply 0 of 0</span>
      <div class="row">
        <button type="button" id="play" class="btn" aria-pressed="false">Play</button>
        <input type="range" id="scrub" min="0" max="0" value="0" step="1" aria-label="Plies laid so far" aria-describedby="scrublabel">
      </div>
    </div>
    <div class="group">
      <span class="label">Build</span>
      <label class="check"><input type="checkbox" id="ghost"> Future work</label>
    </div>
    <div class="group" id="section" hidden>
      <span class="label">Section</span>
      <div class="row">
        <label class="check"><input type="checkbox" id="section-on"> Cut at</label>
        <input type="range" id="section-bl" min="0" max="70" step="0.5" value="35" aria-label="Section station in buttock line inches" aria-describedby="section-station">
        <span id="section-station" class="mono"></span>
      </div>
    </div>
    <div class="group">
      <span class="label">Show</span>
      <div class="row">
        <label class="check"><input type="checkbox" id="labels-on" checked> Part names</label>
        <label class="check"><input type="checkbox" id="paths-on" checked> Load paths</label>
      </div>
    </div>
  </aside>

  <div id="dock">
  <section id="readout" class="card" aria-label="Readout" aria-live="polite">
    <div class="tile" data-k="station"><span class="label">Station</span><b id="ro-station" class="mono"></b></div>
    <div class="tile" data-k="plies" id="t-plies" hidden><span class="label">Plies</span><b id="ro-plies" class="mono"></b></div>
    <div class="tile wide" data-k="layers"><span class="label">Layers here</span><b id="ro-layers"></b></div>
    <div class="tile" data-k="cloth"><span class="label">Cloth so far</span><b id="ro-cloth" class="mono"></b></div>
    <div class="tile" data-k="mass"><span class="label">Mass</span><b id="ro-mass">not yet computed</b></div>
  </section>

  <section id="step" class="card" aria-live="polite" data-open="true">
    <button type="button" id="step-head" aria-expanded="true" aria-controls="step-body">
      <span class="label">Step <span id="step-count" class="mono"></span></span>
      <h2 id="step-title"></h2>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div id="step-body">
      <p id="step-summary"></p>
      <button type="button" class="label" id="checklist-h" aria-controls="checklist">Checklist <span id="check-count" class="mono"></span><span class="fold" aria-hidden="true"></span></button>
      <ul id="checklist"></ul>
    </div>
  </section>
  </div>

  <nav id="opbar" aria-label="Build steps">
    <button type="button" id="bar-home" class="icon" aria-label="Home view" title="Home view">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    </button>
    <div id="chips" role="list"></div>
  </nav>

  <div id="status" role="status">Loading the canard&hellip;</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
