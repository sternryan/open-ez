<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="data-base" content="./">
  <title>Briefing</title>
  <style>
    /* Same tokens and card chrome as the shop (src/style.css) and the Hangar index. */
    :root {
      --ink: #eee9e1;
      --ink-dim: rgba(238, 233, 225, 0.6);
      --ink-soft: rgba(238, 233, 225, 0.84);
      --bg: #0f0d0b;
      --card: rgba(18, 16, 14, 0.62);
      --well: rgba(0, 0, 0, 0.22);
      --line: rgba(238, 233, 225, 0.12);
      --hover: rgba(238, 233, 225, 0.1);
      --accent: #f2b15a;
      --on-ink: #15120f;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --gap: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
    body {
      padding: max(var(--gap), env(safe-area-inset-top)) max(var(--gap), env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left));
      background:
        radial-gradient(ellipse at 18% -10%, rgba(242, 177, 90, 0.07), transparent 46%),
        var(--bg);
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    header.page { max-width: 760px; margin: 8px auto 18px; }
    h1 { margin: 2px 0 0; font-size: clamp(26px, 4vw, 40px); line-height: 1.1; font-weight: 600; letter-spacing: -0.01em; }
    h2 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
    h3 { margin: 14px 0 6px; font-size: 13px; font-weight: 600; }
    p { margin: 0 0 8px; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }
    .kicker { margin: 0 0 4px; font-size: 11px; line-height: 1.2; color: var(--ink-dim); letter-spacing: 0.08em; text-transform: uppercase; }
    .label { display: inline; font-size: 11px; line-height: 1.2; color: var(--ink-dim); letter-spacing: 0.06em; text-transform: uppercase; margin-right: 6px; }
    .question { color: var(--ink-soft); }
    .muted { color: var(--ink-dim); }
    #briefing { max-width: 760px; margin: 0 auto; }
    #briefing:not(:has(.record)) { color: var(--ink-dim); }
    .panel {
      margin-top: var(--gap);
      padding: 16px 16px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      -webkit-backdrop-filter: blur(16px) saturate(1.25);
      backdrop-filter: blur(16px) saturate(1.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
      overflow-wrap: anywhere;
    }
    .rec { margin: 2px 0 12px; font-size: clamp(20px, 3vw, 28px); line-height: 1.15; font-weight: 600; }
    .status { margin: 12px 0 0; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--accent); }
    .cite, .flag, .kind, .note { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
    .flag[data-flag="unknown"] { color: var(--accent); }
    .kind { margin-left: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
    ul { margin: 4px 0 8px; padding-left: 18px; }
    li { margin: 3px 0; }
    details.backbone > summary {
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
      list-style: none;
    }
    details.backbone > summary::-webkit-details-marker { display: none; }
    details.backbone > summary::before { content: "▸ "; color: var(--accent); }
    details.backbone[open] > summary::before { content: "▾ "; }
    details.backbone > summary:hover { color: var(--accent); }
    .option, .score { padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--line); }
    form { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    fieldset { border: 0; margin: 0; padding: 0; min-inline-size: 0; display: flex; flex-direction: column; gap: 8px; }
    fieldset:disabled { opacity: 0.55; }
    legend { padding: 0; font-size: 13px; font-weight: 600; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-dim); }
    textarea, select {
      font: 13px/1.4 var(--sans);
      text-transform: none;
      letter-spacing: 0;
      color: var(--ink);
      background: var(--well);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 10px;
      width: 100%;
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      min-height: 34px;
      border: 1px solid var(--line);
      background: var(--well);
      border-radius: 9px;
      padding: 0 12px;
      align-self: start;
    }
    @media (pointer: coarse) { button, select, textarea { min-height: 44px; } }
    button:hover { background: var(--hover); }
    button:disabled { cursor: default; opacity: 0.55; }
    .transcript { list-style: none; margin: 10px 0 0; padding: 0; }
    .transcript li { padding: 8px 0; border-top: 1px solid var(--line); }
    .who { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-right: 6px; }
    .error { color: var(--accent); margin-top: 8px; }
  </style>
</head>
<body>
  <header class="page">
    <p class="kicker"><a href="hangar.html">Hangar</a></p>
    <h1>Briefing</h1>
  </header>
  <main id="briefing"></main>
  <script type="module" src="/src/hangar/briefing.ts"></script>
</body>
</html>
