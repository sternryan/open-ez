# Camera shots for the chapter tours, keyed by operation id. Ops with no entry get the home view.
# Frame is the viewer's world frame, in inches: X runs aft along the chord, Y is up, and B.L. b sits at Z = -b
# (the canard spans Z from -70.8 to 0; the root is at Z = 0). The home camera looks in from +X, +Y, +Z.
# "target" is the point looked at; "position" is where the camera sits.
shots:
  # Plies laid on the underside are hidden under the core from the home view, so look up at them from below.
  r30.bottom-spar-cap: {target: [5, 0, -27], position: [8, -55, 25]}
  r30.bottom-skin: {target: [6, 0, -33], position: [10, -75, 28]}
  # From the root end, a little above, looking outboard along the web so its ply edges and the slot it lies in show.
  r30.shear-web: {target: [3, 0.4, -20], position: [9, 6, 8]}
  # The upper surface faces the home camera's side, so these two only need a straight-down, span-filling view.
  r30.top-spar-cap: {target: [5, 0.6, -27], position: [8, 55, 25]}
  r30.top-skin: {target: [6, 0.8, -33], position: [10, 75, 28]}
  # Chapter 11, the elevators. Built apart, aft of the canard on two tube jigs (x about 19 to 23), seen from aft and above; on the canard's trailing
  # edge for the travel check, seen along the span from the root so the deflection reads in profile; the hang test likewise.
  r30.elev-bond-cores: {target: [20.5, 0.2, -36], position: [32, 40, 20]}
  r30.elev-uptravel-test: {target: [11.5, 0.2, -13], position: [12, 8, 40]}
  r30.elev-balance-check: {target: [19.8, -0.5, -13], position: [20, 8, 40]}
  r30.elev-travel-check: {target: [11.5, 0.2, -13], position: [12, 8, 40]}
  # the rest of chapter 11: the elevators still apart on their jigs, then on the canard's trailing edge, seen from aft and above
  r30.elev-nc2-inserts: {target: [20.5, 0.2, -36], position: [32, 40, 20]}
  r30.elev-skin-bottom: {target: [20.5, 0.2, -36], position: [32, 40, 20]}
  r30.elev-skin-top: {target: [20.5, 0.2, -36], position: [32, 40, 20]}
  r30.elev-trim-ends: {target: [20.5, 0.2, -36], position: [32, 40, 20]}
  r30.elev-hinges: {target: [11.5, 0.3, -36], position: [20, 40, 20]}
  r30.elev-hinge-slots: {target: [11.5, 0.3, -36], position: [20, 40, 20]}
  r30.elev-flox-hinges: {target: [11.5, 0.3, -36], position: [20, 40, 20]}
  r30.elev-nc12a: {target: [11.5, 0.3, -36], position: [20, 40, 20]}
  r30.canard-tips: {target: [11.5, 0.3, -36], position: [20, 40, 20]}
  r30.elev-trim-belcrank: {target: [11.5, 0.3, -36], position: [20, 40, 20]}
  r30.elev-mass-balance: {target: [11.5, 0.3, -36], position: [20, 40, 20]}
  r30.elev-balance-pockets: {target: [11.5, 0.3, -36], position: [20, 40, 20]}
  r30.elev-cs11: {target: [11.5, 0.3, -36], position: [20, 40, 20]}
