# Chapter 12 — GU canard installation (first edition). The Roncz path installs per chapter 30 instead.
- id: c12.alignment-pins
  chapter: 12
  title: Make and fit the alignment pins
  summary: Turn two headless AN3 bolts into round-nosed pins and drill matching holes in the F28 bulkhead and its doublers. The pins stay loose until the canard is aligned.
  variants: [gu]
  requires: [c10.top-spar-skin, f06.bottom-tape]
  components: [canard.alignment_pins]
  geometry_visible: true
  sources:
    - {doc: scan-1980, scan_pp: 71}
    - {doc: cobelu, heading: STEP 1 – INSTALLING THE ALIGNMENT PINS, figure: I/images/12/12_01.png}
  completion:
    - Two pins cut with rounded noses
    - Holes drilled in F28 and doublers; pins stand out about 1/2 in
    - Pins not bonded yet
- id: c12.align-canard
  chapter: 12
  title: Align the canard on the fuselage
  summary: Clamp the canard to the forward bulkhead and set zero sweep, zero dihedral and zero incidence against the top longerons, shimming the lift tabs as needed, then drill the tabs and fit the rear tabs to the pins.
  variants: [gu]
  requires: [c12.alignment-pins, c11.elevators]
  components: [canard.lift_tabs, canard.rear_tabs]
  geometry_visible: false
  inspection: true
  sources:
    - {doc: scan-1980, scan_pp: 71}
    - {doc: scan-1980, scan_pp: 72}
    - {doc: cobelu, heading: STEP 2 – ALIGNING THE CANARD, figure: I/images/12/12_04.png}
  completion:
    - Tip-to-wing-fitting distances equal on both sides
    - Incidence block reads level with the longerons
    - Lift tabs drilled #10 through the bulkhead
    - Elevator clearance checked through full travel
