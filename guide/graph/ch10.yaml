# Chapter 10 — original GU canard (1980 first edition). Summaries are ours; the plans pages are the authority.
- id: c10.templates-cores
  chapter: 10
  title: Hot-wire templates and foam cores
  summary: Mount the paper templates on thin plywood, then hot-wire the foam blocks into four canard cores (two inboard with the spar trough, two outboard). Offcuts are kept for the elevator and winglet cores later.
  variants: [gu]
  requires: [c03.layup-skills]
  components: [canard.core_gu]
  geometry_visible: true
  sources:
    - {doc: scan-1980, scan_pp: 54}
    - {doc: cobelu, heading: STEP 1 -, figure: I/images/10/10_04.png}
  changes:
    - {cp: 27, lpc: 44, class: MEO, status: verified, kind: official, note: Step 1 calls for a pair of 7x14x41 blocks in two places; only one block is needed., annotation_pp: 54}
    - {cp: 27, lpc: 51, class: MEO, status: conflict, kind: official, note: "Both sources agree the winglet reference should point to chapter 20. They disagree on what the plans say today: the Canard Pusher entry says chapter 13, while this first-edition page and the owner's note say chapter 19.", annotation_pp: 54}
  completion:
    - Templates glued to plywood and trimmed, numbers copied to both faces
    - Four canard cores cut and labeled inboard/outboard, left/right
    - Elevator and winglet foam set aside, not scrapped
- id: c10.shear-web
  chapter: 10
  title: Join the inboard cores and glass the shear web
  summary: Align the two aft inboard cores on a straight 2x4 fixture, bond them at the centerline, recess the aluminum inserts, and lay up the diagonal shear web across the face of the spar trough.
  variants: [gu]
  requires: [c10.templates-cores]
  components: [canard.core_gu, canard.shear_web, canard.lift_tabs]
  geometry_visible: true
  sources:
    - {doc: scan-1980, scan_pp: 55}
    - {doc: scan-1980, scan_pp: 56}
    - {doc: cobelu, heading: STEP 2 -, figure: I/images/10/10_09.png}
  changes:
    - {cp: 25, lpc: 16, class: MEO, status: verified, kind: official, note: The line to mark is waterline 19.4 on the shear web face; it is not a centerline, so drop that word in both places., annotation_pp: 55}
    - {cp: 26, lpc: 30, class: MEO, status: verified, kind: official, note: The three holes in the upper-right lift tab drawing are 1/4 inch., annotation_pp: 56}
    - {cp: 26, lpc: 38, class: MEO, status: verified, kind: official, note: The shear web UND count is 6 pieces, not the 12 printed in two places., annotation_pp: 56}
  completion:
    - Cores straight along a taut string, no dihedral or sweep
    - Aluminum inserts recessed and set in wet micro
    - Shear web plies laid at 45 degrees and cured without bubbles
- id: c10.jig-cores
  chapter: 10
  title: Jig the cores and check for twist
  summary: Set six jig blocks on the table, notch the leading-edge cores around the lift tabs, and fit all six cores upside down in the jig with zero twist before bonding them together.
  variants: [gu]
  requires: [c10.shear-web]
  components: [canard.core_gu]
  geometry_visible: true
  sources:
    - {doc: scan-1980, scan_pp: 57}
    - {doc: cobelu, heading: STEP 3, figure: I/images/10/10_21.png}
  completion:
    - Jig blocks level and in a straight line
    - Cores bonded in the jig with the leading edge straight
    - Incidence checked at several stations; no twist
- id: c10.bottom-spar-skin
  chapter: 10
  title: Bottom spar cap and bottom skin
  summary: Build the bottom spar cap by folding UND into the trough until it is eleven plies thick at the center, then drape and wet out the three-ply bottom skin over the whole canard.
  variants: [gu]
  requires: [c10.jig-cores]
  components: [canard.core_gu, canard.spar_cap_bottom, canard.skin_bottom]
  geometry_visible: true
  materials:
    - {cloth: UND, plies: 11, where: "bottom spar cap at the center"}
    - {cloth: UND, plies: 2, where: "bottom skin"}
    - {cloth: BID, plies: 1, where: "bottom skin"}
  sources:
    - {doc: scan-1980, scan_pp: 58}
    - {doc: scan-1980, scan_pp: 59}
    - {doc: scan-1980, scan_pp: 60}
    - {doc: cobelu, heading: STEP 4 -- \"FLAGGING\" THE SPAR CAP, figure: I/images/10/10_28.png}
  completion:
    - Spar cap folded to full thickness with fibers straight
    - BID pieces placed without overlapping each other
    - Edges knife-trimmed while the layup is still green
- id: c10.top-spar-skin
  chapter: 10
  title: Top spar cap and top skin
  summary: Turn the canard right side up in a level fixture, add the high-density foam blocks for the elevator hinges, then lay up the thicker top spar cap and the four-ply top skin, lapping the bottom skin at the leading edge.
  variants: [gu]
  requires: [c10.bottom-spar-skin]
  components: [canard.core_gu, canard.hinge_foam, canard.spar_cap_top, canard.skin_top]
  geometry_visible: true
  materials:
    - {cloth: UND, plies: 3, where: "top skin"}
    - {cloth: BID, plies: 1, where: "top skin"}
  sources:
    - {doc: scan-1980, scan_pp: 61}
    - {doc: scan-1980, scan_pp: 62}
    - {doc: scan-1980, scan_pp: 63}
    - {doc: scan-1980, scan_pp: 64}
    - {doc: cobelu, heading: STEP 5 - INSTALLING THE UPPER SPAR CAP AND SKIN, figure: I/images/10/10_45.png}
  completion:
    - Hinge foam blocks set at the marked stations
    - Top cap and skin cured; contour checked with the template
    - Trailing edge trimmed flush with the bottom skin
