- id: f21.pressure-check
  chapter: 21
  title: Leak check by altitude change
  summary: Seal the tank, plug the 3/8 in line at the forward cockpit and tee an altimeter into the vent. Raise the pressure by mouth, never with a pump, to the equivalent of 1500 ft of altitude, and wait several hours. A tank that holds is done; a leak gets repaired and tested again.
  variants: [both]
  requires: [f21.outside-top]
  components: [strake.tank]
  geometry_visible: true
  inspection: true
  sources:
    - {doc: scan-1980, scan_pp: 145}
  changes:
    - {cp: 38, lpc: 0, class: INFO, status: verified, kind: community, note: "Test by mouth only, never above 1500 ft equivalent; pinholes in the outboard ribs are the usual leak."}
  completion:
    - Outlet line plugged and an altimeter on the vent tee
    - Pressure held at 1500 ft equivalent for several hours
    - Leaks repaired and the test repeated
- id: f21.fairing-caps
  chapter: 21
  title: Leading-edge fairing blocks and fuel caps
  summary: With the wing fitted, carve a 2 lb urethane block to the rib noses and skin it with two UND plies crossing at 45 deg, lapping 1/2 in onto the skins and fuselage. After paint, bore a 2 1/4 in hole in the aft half of each tank, flox the 2 in aluminium rim in, and fit the Dzus cap with its slot fore and aft. The 1/4 in drain marked step 10 on page 21-7 vents the closed-off outboard area; it is not a tank drain.
  variants: [both]
  requires: [f21.pressure-check, f19.attach]
  components: [strake.fairing, strake.fittings]
  geometry_visible: true
  materials:
    - {cloth: UND, plies: 2, where: "fairing block skin, crossing at 45 deg, 1/2 in laps"}
  sources:
    - {doc: scan-1980, scan_pp: 145}
    - {doc: scan-1980, scan_pp: 147}
  changes:
    - {cp: 30, lpc: 84, class: MEO, status: verified, kind: official, note: "Use a 2 lb/ft3 urethane block with two UND plies crossing at 45 deg, lapping 1/2 in, on the leading-edge flats."}
    - {cp: 27, lpc: 0, class: INFO, status: verified, kind: community, note: "The caps are not airtight; a sealed cap needs a second vent."}
    - {cp: 31, lpc: 0, class: INFO, status: verified, kind: community, note: "Tether each cap to its cross wire with a short chain."}
  completion:
    - Urethane block carved to the rib noses and skinned at 45 deg
    - Cap holes bored in the aft half of each tank after paint
    - Caps fitted with the slot fore and aft and tethered
- id: f21.plumbing
  chapter: 21
  title: Fuel valve, pumps and gascolator
  summary: Plumbing is installation only here and has no modelled geometry. Mount the left-right-off valve on the lower front floor just under the instrument panel, the electric pump high enough to reach its filter, and the gascolator at the lower right of the firewall, then connect valve, pump, gascolator and engine with fire-sleeved hose. The engine side is Section II work, which this guide does not hold.
  variants: [both]
  requires: [f21.fairing-caps, f15.stainless-firewall, f06.bond-panel]
  components: []
  geometry_visible: false
  sources:
    - {doc: scan-1980, scan_pp: 145}
    - {doc: scan-1980, scan_pp: 148}
  changes:
    - {cp: 24, lpc: 1, class: MAN, status: verified, kind: official, note: "Safety the pump cap: bend the tab 90 deg, drill a #50 hole and lockwire it."}
    - {cp: 32, lpc: 96, class: MEO, status: verified, kind: official, note: "The fuel valve bracket is 0.062 in 2024-T3, with a trim handle on the valve."}
    - {cp: 60, lpc: 0, class: INFO, status: verified, kind: community, note: "The new fuel valve fits the original bracket in the same left-right orientation."}
  completion:
    - Valve on the lower front floor under the panel
    - Pump and gascolator mounted, pump cap safetied
    - Lines run and the fire sleeve fitted
