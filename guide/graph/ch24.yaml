  components: [cover.consoles]
  geometry_visible: true
  materials:
    - {cloth: BID, plies: 2, where: "outside of the tops LC2 and LC5"}
    - {cloth: BID, plies: 1, where: "inside of the sides LC3, LC4 and LC6"}
  sources:
    - {doc: scan-1980, scan_pp: 160}
    - {doc: scan-1980, scan_pp: 159}
  changes:
    - {cp: 33, lpc: 0, class: DES, status: verified, kind: community, note: "Do not bond the consoles in permanently until all the controls are installed."}
  completion:
    - LC2, LC3 and LC4 cut to the printed sizes (LC2 length noted as 30.6 or 30.8)
    - Trim-lever hole in LC4 and throttle cutout in LC2
