- id: f24.thigh-support
  chapter: 24
  title: Front thigh support and fuel-valve cover
  summary: Cut two ribs 10.8 in long and 3.65 in tall at the front from 0.35 in R45, with a curved top drawn on a sheet this guide does not hold, and notch one for the fuel lines. Cut the floor, 17 by 12.3 in with a 5.6 by 4.5 in notch, heat it to about 280 F and bend it. The ribs stand 5.6 in apart with the fuel valve between. Bond and glass the ribs with one ply, then the floor with one ply inside and two outside, strong enough to stand on. Close the gap under the right console with one more ply. Make the fuel-valve cover from 0.025 in aluminium, 6.6 by 5.0 in, silicone it on with no screws, and mark OFF, LEFT and RIGHT.
  variants: [both]
  requires: [f24.consoles-left, f06.bond-panel, f21.plumbing]
  components: [cover.thigh, cover.valve]
  geometry_visible: true
  materials:
    - {cloth: BID, plies: 1, where: "ribs, bonded to the floor and panel"}
    - {cloth: BID, plies: 1, where: "floor, inside"}
    - {cloth: BID, plies: 2, where: "floor, outside, lapping the panel, bottom and consoles"}
  sources:
    - {doc: scan-1980, scan_pp: 160}
  changes:
    - {cp: 27, lpc: 0, class: MEO, status: verified, kind: community, note: "Close the gap under the right console beneath the thigh support with one ply of BID."}
  completion:
    - Two ribs cut, one notched for the fuel lines (curve is a fitted shape)
    - Floor cut 17 by 12.3 in with the notch, heated and bent
    - Ribs and floor bonded and glassed, 1 ply inside and 2 outside
    - Gap under the right console closed
    - Aluminium cover 6.6 by 5.0 in on with silicone, valve placard marked
- id: f24.canard-cover
  chapter: 24
  title: Canard cover
  summary: Fit a block of 2 in green urethane to the canard top and the fuselage, oversize, and tape the fuselage, nose, F28 and elevator slot. Bond it with wet micro to the sanded canard and carve it. Glass the outside with two plies of BID lapping about 1/4 in onto the canard. After the cure remove the canard, hollow the foam, and lay two plies of BID inside with flox corners. The plans print no size beyond the 2 in thickness, so the shape is a fitted outline. After paint seal the joint with a white silicone bead and cure it two to three days before the canard comes off. Not over four man-hours.
  variants: [both]
  requires: [f24.thigh-support, c12.align-canard, f13.nose-door]
  components: [cover.canard]
  geometry_visible: true
  materials:
    - {cloth: BID, plies: 2, where: "outside, lapped about 1/4 in onto the canard"}
    - {cloth: BID, plies: 2, where: "inside, on the bare foam, with flox corners"}
  sources:
    - {doc: scan-1980, scan_pp: 161}
  changes:
    - {cp: 35, lpc: 0, class: OPT, status: verified, kind: community, note: "Soft sponge rubber at the elevator tubes and RTV at the canard-to-fuselage joint cut the air leak."}
  completion:
    - Foam block bonded to the sanded canard top and carved
    - Outside glassed with 2 plies and trimmed
    - Canard removed, foam hollowed, inside glassed with 2 plies
    - Silicone seal after paint noted
- id: f24.gap-seal
  chapter: 24
  title: Seal between the wing and the centre section
  summary: This is the seal that chapter 19 and chapter 23 point to. About half an inch of space separates the wing root from the centre-section spar; the printed fraction cannot be told from 3/4 at this scan resolution. Push urethane foam wedges in with micro on the wing side, let them cure, then sand them to shape and leave 1/16 in at the front. Remove the wing, lay one ply of BID round the foam, and seal the same way along the wing leading-edge and strake gap. After paint fill the small gap with silicone; lay release film on one side if the wings come off often. Air spilling here costs performance and spills engine cooling air.
  variants: [both]
  requires: [f24.canard-cover, f19.attach, f21.fairing-caps]
  components: [cover.seal]
  geometry_visible: true
  materials:
    - {cloth: BID, plies: 1, where: "round the foam wedges"}
  sources:
    - {doc: scan-1980, scan_pp: 161}
    - {doc: scan-1980, scan_pp: 134}
  completion:
    - Foam wedges bonded in the 1/2 in gap on the wing side
    - Wedges sanded to shape with 1/16 in left at the front
    - One ply of BID laid round the foam with the wing off
    - Silicone fill after paint noted
