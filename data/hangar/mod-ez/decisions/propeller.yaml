id: propeller
spot: mod-ez
title: Propeller
status: open
question: Which kind of propeller does the Mod-EZ run behind the 912 iS gearbox?
axes:
- id: propeller
  options:
  - wood-fixed-book
  - carbon-wood-fixed
  - ground-adjustable-composite
  - in-flight-adjustable
coupled_with:
- powerplant-fuel-resin
replaces:
- f23.engine-install
- f23.cowl-closeout
book_choice:
  text: The book allows only light-weight fixed-pitch solid wood propellers; constant speed, variable pitch and metal propellers
    are not recommended because a pusher propeller would need extensive development and vibration testing.
  cite: om-1980:p5
options:
- id: wood-fixed-book
  label: Fixed-pitch solid wood (the book)
  kind: book
  facts:
  - text: For the O-235 the owner's manual lists 58 in diameter with 72 in pitch (cruise prop) or 66 in pitch (climb prop)
    cite: om-1980:p5
  - text: The designers prefer the climb prop for the best takeoff performance
    cite: om-1980:p6
  - text: The airplane's designers later found 62 in diameter by 66 in pitch best for the O-235 on two airplanes with several
      hundred hours, larger than the plans back page
    cite: cp-text:p33
  - text: Static rpm at full throttle must be at least 2450 for normal takeoff performance (an O-235 figure)
    cite: om-1980:p13
  - text: Rotation direction of the book propeller
    flag: unknown
  - text: Weight of the book wood propeller
    flag: unknown
  why: 'baseline: the only type the book approves for the pusher; it is matched to a direct-drive engine, not to a geared
    one'
- id: carbon-wood-fixed
  label: Fixed-pitch carbon with wood core
  kind: candidate
  facts:
  - text: 'Catto lists Long EZ propellers with a carbon structure and wood core: two-blade 66 in for 180-200 hp and 64 in
      for 150-160 hp, three-blade 60 in, and says most canards need a 6 in or 8 in extension'
    cite: catto-canards:p1
  - text: The 912 iS propeller shaft turns counter clockwise looking towards the face of the flange
    cite: rotax-im-912i:p1
  - text: 'Inference: if the flange face points aft on a pusher (no reverse-rotation variant fitted), the propeller turns
      counter clockwise seen from behind, a left-turning pusher propeller; a reseller guide says pushers run a left turning
      propeller on the Rotax 912 family'
    flag: derived
  - text: Catto statement for the Rotax 912 iS, weight and price
    flag: unknown
  why: 'kept: closest to the book (fixed pitch, wood in the structure), but no source ties it to this engine or to a geared
    5800 rpm drive'
- id: ground-adjustable-composite
  label: Ground-adjustable composite
  kind: candidate
  facts:
  - text: 'Sensenich 3B0R5 pusher blades (L68C): 68 in maximum and 64 in minimum diameter, 9.0 lb without spacer, approved
      for Rotax 912, 912S, 912iS and 914 series reduction drives, 5800 rpm engine, 80-115 hp'
    cite: sensenich-3b0r5:p1
  - text: 'Sensenich 2A0R5/L69E two-blade pusher: 69 in maximum and 65 in minimum, 10.5 lb, same engine list'
    cite: sensenich-2a0:p1
  - text: The 912 iS gearbox ratio is 2.4286 and the propeller moment of inertia window is 1500 to 6000 kg cm2
    cite: rotax-im-912i:p1
  - text: The 912 iS propeller shaft turns counter clockwise looking towards the face of the flange
    cite: rotax-im-912i:p1
  - text: 'Inference: if the flange face points aft on a pusher (no reverse-rotation variant fitted), the propeller turns
      counter clockwise seen from behind, a left-turning pusher propeller; a reseller guide says pushers run a left turning
      propeller on the Rotax 912 family'
    flag: derived
  - text: Maximum takeoff engine speed 5800 rpm over the 2.4286 ratio is about 2388 propeller rpm. That is a ceiling, not
      a static reading, and the book's 2450 static minimum is a direct-drive O-235 check that does not transfer to a geared
      engine
    flag: derived
  - text: Approval of any of these for a Long-EZ airframe, and the pitch to set
    flag: unknown
  why: 'kept: the maker table found that names the 912 iS and has pusher blades; pitch can be set on the ground to fit the
    geared engine, but the book does not approve non-wood propellers for this airplane'
- id: in-flight-adjustable
  label: Constant speed (hydraulic governor)
  kind: candidate
  facts:
  - text: MT-Propeller lists the MTV-34 hydraulic constant-speed propeller for the Rotax 912/914 series and the 915 iS, three-blade
      9 kg (19.8 lb) plus a 1 kg governor
    cite: mt-mtv34:p1
  - text: On the certified Sport series the iSc3 variant has the hydraulic governor drive (64,4 kg) and the iSc2 has a fixed-propeller
      flange (63,6 kg)
    cite: easa-tcds-e121:p13
  - text: The book does not recommend constant speed or variable pitch propellers for the pusher, citing aerodynamic-induced
      vibration and the development testing needed
    cite: om-1980:p5
  - text: Pusher approval for the MTV-34 and a Long-EZ installation
    flag: unknown
  why: 'kept: widest operating range, but it needs the governor-drive engine variant and goes against the book''s explicit
    caution, so it needs its own vibration evidence'
- id: airmaster-electric
  label: Electric constant speed (Airmaster)
  kind: unavailable
  facts:
  - text: The listed Airmaster AP332 configuration is a clockwise tractor, 70 in, 25 lbs, for Rotax 912, 912S and 914; no
      pusher configuration appears on the page
    cite: airmaster-ap332:p1
  - text: Airmaster pusher configuration for the 912 iS
    flag: unknown
  - text: A 25 lb hub is heavy against the 9 to 10 lb ground-adjustable composites, which would matter for the empty weight
      and for where the weight sits
    flag: judgment
  why: 'none found: no pusher configuration turned up on the page; kept so it can be reopened'
- id: metal-fixed
  label: Metal fixed pitch
  kind: dropped
  facts:
  - text: The book does not recommend metal propellers for the pusher, citing aerodynamic-induced vibration
    cite: om-1980:p5
  why: dropped on the book's own caution; no other source was found either way
positions: []
unknowns:
- text: Prop-tip-to-ground clearance of the Long-EZ in the tail-down attitude for each diameter (the manual prints only a
    rotation-angle limit, and the clearance rule of thumb found is general homebuilder advice, not a Long-EZ number)
  how: measure on the airframe with the nose gear in its takeoff and landing attitudes
- text: Maximum propeller diameter that fits a Long-EZ (the plans back-page figure was not read; the designers flew a larger
    propeller than the plans show)
  how: read the plans back page; measure on the airframe
- text: Rotation direction of the book propeller
  how: plans or the Canard Pusher index of propeller articles
- text: Whether the maker's 2021 Warp Drive manual names the 912 iS (the older manual does, the newer table extract does not)
  how: ask the maker
- text: A tip-speed or noise limit for the 912 iS gearbox propeller
  how: maker installation manual or a noise measurement
- text: Pusher yaw and pitch effect of a left-turning versus right-turning propeller on this airframe
  how: flight test
