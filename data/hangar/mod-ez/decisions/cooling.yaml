id: cooling
spot: mod-ez
title: Engine cooling for the 912 iS
status: open
question: How is the 912 iS cooled in the Mod-EZ, and where do the radiator, oil cooler and coolant go?
axes:
- id: cooling_layout
  options:
  - air-cooled-book
  - radiator-nose-duct
  - radiator-belly-duct
  - radiator-aft-duct
coupled_with:
- powerplant-fuel-resin
- cg-ballast
replaces:
- f23.engine-install
- f23.cowl-closeout
book_choice:
  text: The book airplane's O-235 is air cooled by cowl air (engine type; not checked against the owner's manual here).
options:
- id: air-cooled-book
  label: Air-cooled engine (book)
  kind: book
  facts:
  - text: The book engine is the air-cooled Lycoming O-235; it has no liquid cooling system
    flag: derived
  - text: The 912 iS needs about 1.5 l of coolant for its liquid-cooled cylinder heads, so this layout does not apply to it
    flag: derived
  why: 'baseline: no coolant system to place; the 912 iS does not use it because its cylinder heads are liquid cooled (the
    maker lists coolant, a radiator and an expansion tank)'
- id: radiator-nose-duct
  label: Radiator and oil cooler forward, ducted from the nose
  kind: candidate
  facts:
  - &id001
    text: The maker lists the coolant radiator at 1.5 kg (3.3 lb), separate from the 63.6 kg base engine
    cite: rotax-im-912i:p1
  - &id002
    text: The maker lists the oil radiator at 1.0 kg (2.2 lb).
    cite: rotax-im-912i:p1
  - &id003
    text: The maker lists the oil cooler at 0.6 kg (1.32 lb).
    cite: rotax-im-912i:p1
  - &id004
    text: The maker gives the total coolant quantity for the engine as approximately 1.5 l (0.4 US gal).
    cite: rotax-im-912i:p1
  - &id005
    text: The maker lists a cooling air baffle at 0.36 kg (0.79 lb); the manual does not say whether this is the tractor or
      the pusher part
    cite: rotax-im-912i:p1
  - &id006
    text: The maker lists the overflow bottle at approximately 0.5 l (0.13 US gal).
    cite: rotax-im-912i:p1
  - &id007
    text: The maker's hose specification gives an inner diameter of 25 mm for coolant hoses.
    cite: rotax-im-912i:p1
  - &id008
    text: The maker's coolant capacity table lists a 2 m coolant hose with an inner diameter of 18 mm.
    cite: rotax-im-912i:p1
  - &id009
    text: SI-912 i-001R7 permits ethylene-glycol coolant with 50 percent water and does not permit waterless propylene-glycol
      coolant on the 912 i Series.
    cite: si-912-i-001r7-si-912-016r12:p1
  - &id010
    text: SI-PAC-014 Revision 1 states a maximum weight of 0.82 kg for the extra-large oil radiator.
    cite: si-pac-014-revision-1-oil-radiator-sets:p1
  - text: Duct size, drag and the real pusher airflow for a nose radiator on this airframe are not sourced
    flag: unknown
  why: 'kept: judgment: a forward radiator has the easiest air supply, but the coolant and oil lines would run the length
    of the fuselage and its mass sits forward of the engine, which moves the CG forward (geometry, not sourced)'
- id: radiator-belly-duct
  label: Radiator and oil cooler in a belly duct under the engine
  kind: candidate
  facts:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
  - *id008
  - *id009
  - *id010
  - text: Duct size, drag and the real pusher airflow for a belly radiator on this airframe are not sourced
    flag: unknown
  why: 'kept: short hoses and the masses stay near the engine, but a belly scoop touches the outer shape and ground clearance'
- id: radiator-aft-duct
  label: Radiator and oil cooler aft of the engine in the cowl
  kind: candidate
  facts:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
  - *id008
  - *id009
  - *id010
  - text: Whether the pusher cowl can pass enough air at the radiator, and the duct drag, are not sourced
    flag: unknown
  why: 'kept: judgment: radiator and cooler masses aft of the CG act as ballast (geometry); whether a pusher cowl can pass
    enough air there is not sourced'
