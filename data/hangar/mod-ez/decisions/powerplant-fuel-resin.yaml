book_choice:
  text: the book airplane uses the Lycoming O-235, two wing tanks totalling 52 gal, aviation gasoline, and a maximum true
    cruise of 161 kt at 75 percent power
  cite: om-1980:p15
options:
- id: o235-book
  label: Lycoming O-235
  kind: book
  facts:
  - text: 243 lb dry incl. starter and generator
    cite: tcds-e223:p7
  - text: 5.8 gal/h at 65 percent, 77 hp
    cite: lyc-om-o235:p3-8
  - text: the manual warns that autogas can dissolve the epoxy in the fuel tanks
    cite: om-1980:p8
  why: baseline, kept so the lineage is complete.
- id: ul350i
  label: UL350i
  kind: candidate
  facts:
  - text: 118 hp, ready-to-fly 78.4 kg (173 lb)
    cite: ulpower-ul350i:p1
  - text: mogas minimum 95 RON (91 AKI) below serial 223501, 91 RON (87 AKI) above, 100LL allowed if mogas is unavailable
    cite: ulpower-ul350i:p1
  - text: estimated cruise about 18 L/h
    cite: ulpower-ul350i:p1
  - text: ethanol limit
    flag: unknown
  why: 'kept: about 70 lb lighter installed than the book engine on the maker''s ready-to-fly weight, so the tail gets lighter
    and the empty CG moves forward; runs on mogas; its ethanol limit is the open question. Weight bases differ between candidates
    (ready-to-fly, operational, a build-up of listed parts), so the weights are not strictly like for like'
- id: ul350is
  label: UL350iS
  kind: candidate
  facts:
  - text: operational weight 79.5 kg (175 lb) shared with UL350i
    cite: ulpower-techdata:p1
  - text: power and fuel specifics not verified
    flag: unknown
  why: 'kept: same weight class as the UL350i; its power and fuel numbers have not been verified, so it is scored with unknowns'
- id: rotax-912is
  label: Rotax 912iS
  kind: candidate
  facts:
  - text: 63.6 kg with gearbox plus add-ons
    cite: rotax-912is-datasheet:p1
  - text: 16.5 L/h (4.3 gal/h) at 75 percent
    cite: rotax-912is-om:p1
  - text: more than 10 percent ethanol is not permitted
    cite: rotax-fuel-si:p1
  - text: coolant and radiator weight
    flag: unknown
  why: 'kept: a published fuel flow at 75 percent power (69 hp), close to the mission cruise power; the maker limits ethanol
    to 10 percent, which ties it to the tank-resin question; coolant and radiator weight are not yet known'
- id: rotax-915is
  label: Rotax 915iS
  kind: candidate
  facts:
  - text: 141 hp for 5 min and 82.2 kg with gearbox, turbo, intercooler and exhaust on the maker card; the EASA data sheet
      gives 84.6 kg dry for the 915 iSc2 A on a larger include list
    cite: easa-tcds-e121:p13
  - text: 'Maker deck row at 5500 rpm: 87,47 kW burns 26,53 kg/h (about 303 g/kWh); the deck prints kg/h only'
    cite: rotax-om-915i:p1
  - text: TBO 1200 h or 15 years, whichever comes first
    cite: rotax-mml-915i:p1
  - text: coolant and radiator weight
    flag: unknown
  why: 'kept, not chosen: about 35 lb heavier installed than the 912 iS on the same build-up basis and more power than the
    mission needs; its fuel flow is derived from one maker deck row, so the range figure is rough'
- id: rotax-916is
  label: Rotax 916iS
  kind: candidate
  facts:
  - text: 160 hp and 85.8 kg with gearbox, turbo, intercooler and exhaust (maker page); the EASA data sheet gives 85.8 kg
      dry for the 916 iSc2 A
    cite: easa-tcds-e121:p13
  - text: 'Maker deck row at 5500 rpm: 89,96 kW burns 22,48027 kg/h (250 g/kWh); the deck prints kg/h only'
    cite: rotax-om-916i:p1
  - text: TBO 2,000 hrs
    cite: rotax-916is-page:p1
  - text: coolant and radiator weight
    flag: unknown
  why: 'kept, not chosen: about 37 lb heavier installed than the 912 iS on the same build-up basis and more power than the
    mission needs; its fuel flow is derived from one maker deck row, so the range figure is rough'
- id: deltahawk-dhk180
  label: DeltaHawk DHK180
  kind: dropped
  facts:
  - text: 335 lb (151 kg) estimated
    cite: deltahawk-spec-2025:p1
  why: dropped, the wrong direction for this CG; can be reopened.
- id: electric
  label: Electric
  kind: dropped
  facts:
  - text: a flown electric Long-EZ carried a 525 lb pack, 450 V 80 Ah
    cite: wired-yates-2013:p1
  - text: 'The flown pack stored 36 kWh (450 V x 80 Ah = 36,000 Wh) in 525 lb (238 kg): about 151 Wh/kg at pack level'
    flag: derived
  - text: a 500 Wh/kg cell is a company claim, cell level only
    cite: amprius-sicore500:p1
  - text: 'Method: shaft power 52 kW at 150 kt (cube-law scaling of the manual''s 161 kt at 75 percent of 115 hp) over 0.96
      motor efficiency for 2.5 h is about 136 kWh; at 500 Wh/kg that is about 272 kg (600 lb) of cells before pack structure
      and reserve'
    flag: derived
  why: 'dropped for now: the numbers do not close the 300 nm mission with a pack that has flown (151 Wh/kg) or a claimed cell
    (500 Wh/kg, cell level); kept so it can be reopened when cells improve'
- id: hybrid
  label: Hybrid
  kind: unavailable
  facts:
  - text: no homebuilder hybrid kit with a published price was found
    flag: unknown
  why: 'none found: no homebuilder hybrid kit with a published price turned up in the sweep (not independently re-checked);
    kept so it can be reopened'
- id: ul94-ethanol-free
  label: UL94 Ethanol-Free
  kind: candidate
  facts:
  - text: UL94 is ethanol-free and weighs 5.87 lb/gal
    cite: swift-ul94-faq:p1
  why: 'kept: removes the ethanol question, but no source shows how the book tank resin behaves in UL94, so the resin choice
    stays open'
  implies:
    tank_resin: No source tests UL94 on the book's epoxy tanks, so keeping the conventional tank resin is unconfirmed.
    flag: unknown
- id: mogas-e10
  label: Mogas E10
  kind: candidate
  facts:
  - text: ethanol can partly dissolve resins in composite tanks
    cite: bmaa-sb2695:p1
  - text: In a builder's 18-month immersion test (54 coupons, two per test) of E-Z Poxy, MGS and Jeffco epoxies in 100LL and
      8.4 percent ethanol mogas, none showed visible deterioration; all gained some weight, and post-cure mattered more than
      brand. Small sample, not a long-term or maker rating
    cite: kitplanes-tank-epoxy-2018:p1
  why: 'kept: the common automotive fuel, but ethanol can partly dissolve some composite-tank resins (judgment: the book''s
    tank resin is not shown safe), so this path needs a tank resin that is shown to hold up, with a good post-cure (the rehearsal
    player carries an open placeholder for it); vapor lock in a hot pusher engine bay is a further judgment-level concern
    with no source here'
  implies:
    tank_resin: Ethanol can partly dissolve some composite-tank resins, so this path needs a tank resin shown to hold up in
      E10 with a good post-cure; which resin is not yet decided.
    cite: bmaa-sb2695:p1
positions:
- role: propulsion
  picks:
    engine: rotax-912is
  confidence: high
  reasoning: The Rotax 912iS is the only candidate with a verified cruise fuel flow of 16.5 L/h at 75% power <rotax-912is-om:p1>.
    The 915iS and 916iS offer more power, but their cruise fuel flows are unknown <rotax-915is-card:p1, rotax-916is-page:p1>,
    making them speculative 'waste' for this mission. The UL350i is lighter but its fuel specifics are not fully verified
    <ulpower-ul350i:p1>.
  citations:
  - rotax-912is-om:p1
  - rotax-915is-card:p1
  - rotax-916is-page:p1
  - ulpower-ul350i:p1
  judgment: false
- role: structures
  picks:
    fuel_path: ul94-ethanol-free
  confidence: medium
  reasoning: Choosing Mogas E10 introduces a risk where ethanol can dissolve resins in composite tanks <bmaa-sb2695:p1>. While
    a small-scale test showed some epoxies held up <kitplanes-tank-epoxy-2018:p1>, the compatibility of the specific book
    tank resin with UL94 is unknown <ul94-ethanol-free:p1>. UL94 is ethanol-free <swift-ul94-faq:p1>, making it the safer
    structural choice, though the final decision depends on the unconfirmed behavior of the epoxy tanks in UL94.
  citations:
  - bmaa-sb2695:p1
  - kitplanes-tank-epoxy-2018:p1
  - swift-ul94-faq:p1
  judgment: true
- role: fuel-systems
  picks:
    fuel_path: ul94-ethanol-free
  confidence: medium
  reasoning: The Rotax 912iS specifically prohibits more than 10 percent ethanol <rotax-fuel-si:p1>. Using UL94 ethanol-free
    <swift-ul94-faq:p1> avoids the ethanol-related resin dissolution risks associated with Mogas E10 <bmaa-sb2695:p1>.
  citations:
  - rotax-fuel-si:p1
  - swift-ul94-faq:p1
  - bmaa-sb2695:p1
  judgment: false
- role: aero-flight-test
  picks: {}
  reasoning: No flight test data is available to verify the cruise fuel flows for the higher-power Rotax models (915iS/916iS)
    or the UL350i average <rotax-915is-card:p1, rotax-916is-page:p1, ulpower-ul350i:p1>. A common-power model for each engine
    is required to close the paper case. (uncited)
  citations: []
  judgment: true
  confidence: low
- role: historian
  picks:
    engine: o235-book
  confidence: high
  reasoning: The baseline for the mission is the Lycoming O-235, which uses aviation gasoline and provides a maximum true
    cruise of 161 kt at 75% power <om-1980:p15>.
  citations:
  - om-1980:p15
  judgment: false
