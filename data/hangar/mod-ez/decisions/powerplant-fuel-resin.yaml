id: powerplant-fuel-resin
spot: mod-ez
status: open
question: Which engine, on which fuel, and with which tank resin, for the Mod-EZ?
title: Powerplant, fuel and tank resin
coupled_with: []
replaces:
- f23.engine-install
- f23.carb-bracket
- f21.inside-layups
- f21.plumbing
book_choice:
  text: the book airplane uses the Lycoming O-235, two wing tanks totalling 52 gal, aviation gasoline, and a maximum true
    cruise of 161 kt at 75 percent power
  cite: om-1980:p15
options:
- id: o235-book
  label: Lycoming O-235
  kind: book
  facts:
  - text: 243 lb dry incl. starter and generator
    cite: tcds-e223:p7
  - text: 5.8 gal/h at 65 percent, 77 hp
    cite: lyc-om-o235:p3-8
  - text: the manual warns that autogas can dissolve the epoxy in the fuel tanks
    cite: om-1980:p8
  why: baseline, kept so the lineage is complete.
- id: ul350i
  label: UL350i
  kind: candidate
  facts:
  - text: 118 hp, ready-to-fly 78.4 kg (173 lb)
    cite: ulpower-ul350i:p1
  - text: mogas minimum 95 RON (91 AKI) below serial 223501, 91 RON (87 AKI) above, 100LL allowed if mogas is unavailable
    cite: ulpower-ul350i:p1
  - text: estimated cruise about 18 L/h
    cite: ulpower-ul350i:p1
  - text: ethanol limit
    flag: unknown
  why: 'kept: about 70 lb lighter installed than the book engine on the maker''s ready-to-fly weight, so the tail gets lighter
    and the empty CG moves forward; runs on mogas; its ethanol limit is the open question. Weight bases differ between candidates
    (ready-to-fly, operational, a build-up of listed parts), so the weights are not strictly like for like'
- id: ul350is
  label: UL350iS
  kind: candidate
  facts:
  - text: operational weight 79.5 kg (175 lb) shared with UL350i
    cite: ulpower-techdata:p1
  - text: power and fuel specifics not verified
    flag: unknown
  why: 'kept: same weight class as the UL350i; its power and fuel numbers have not been verified, so it is scored with unknowns'
- id: rotax-912is
  label: Rotax 912iS
  kind: candidate
  facts:
  - text: 63.6 kg with gearbox plus add-ons
    cite: rotax-912is-datasheet:p1
  - text: 16.5 L/h (4.3 gal/h) at 75 percent
    cite: rotax-912is-om:p1
  - text: more than 10 percent ethanol is not permitted
    cite: rotax-fuel-si:p1
  - text: coolant and radiator weight
    flag: unknown
  why: 'kept: a published fuel flow at 75 percent power (69 hp), close to the mission cruise power; the maker limits ethanol
    to 10 percent, which ties it to the tank-resin question; coolant and radiator weight are not yet known'
- id: rotax-915is
  label: Rotax 915iS
  kind: candidate
  facts:
  - text: 82.2 kg, 141 hp for 5 min
    cite: rotax-915is-card:p1
  - text: cruise fuel flow
    flag: unknown
  why: 'kept: more power than the mission needs; no published cruise fuel flow, so it is scored with unknowns'
- id: rotax-916is
  label: Rotax 916iS
  kind: candidate
  facts:
  - text: 85.8 kg, 160 hp
    cite: rotax-916is-page:p1
  - text: cruise fuel flow
    flag: unknown
  why: 'kept: more power than the mission needs; no published cruise fuel flow, so it is scored with unknowns'
- id: deltahawk-dhk180
  label: DeltaHawk DHK180
  kind: dropped
  facts:
  - text: 335 lb (151 kg) estimated
    cite: deltahawk-spec-2025:p1
  why: dropped, the wrong direction for this CG; can be reopened.
- id: electric
  label: Electric
  kind: dropped
  facts:
  - text: a flown electric Long-EZ carried a 525 lb pack, 450 V 80 Ah
    cite: wired-yates-2013:p1
  - text: 'The flown pack stored 36 kWh (450 V x 80 Ah = 36,000 Wh) in 525 lb (238 kg): about 151 Wh/kg at pack level'
    flag: derived
  - text: a 500 Wh/kg cell is a company claim, cell level only
    cite: amprius-sicore500:p1
  - text: 'Method: shaft power 52 kW at 150 kt (cube-law scaling of the manual''s 161 kt at 75 percent of 115 hp) over 0.96
      motor efficiency for 2.5 h is about 136 kWh; at 500 Wh/kg that is about 272 kg (600 lb) of cells before pack structure
      and reserve'
    flag: derived
  why: 'dropped for now: the numbers do not close the 300 nm mission with a pack that has flown (151 Wh/kg) or a claimed cell
    (500 Wh/kg, cell level); kept so it can be reopened when cells improve'
- id: hybrid
  label: Hybrid
  kind: unavailable
  facts:
  - text: no homebuilder hybrid kit with a published price was found
    flag: unknown
  why: 'none found: no homebuilder hybrid kit with a published price turned up in the sweep (not independently re-checked);
    kept so it can be reopened'
- id: ul94-ethanol-free
  label: UL94 Ethanol-Free
  kind: candidate
  facts:
  - text: UL94 is ethanol-free and weighs 5.87 lb/gal
    cite: swift-ul94-faq:p1
  - text: 'tank-resin consequence: no source tests UL94 on the book''s epoxy tanks, so a conventional tank resin is unconfirmed'
    flag: unknown
  why: 'kept: removes the ethanol question, but no source shows how the book tank resin behaves in UL94, so the resin choice
    stays open'
- id: mogas-e10
  label: Mogas E10
  kind: candidate
  facts:
  - text: ethanol can partly dissolve resins in composite tanks
    cite: bmaa-sb2695:p1
  - text: 'tank-resin consequence: a fuel-resistant tank resin is needed, and which one is not yet decided'
    flag: judgment
  - text: In a builder's 18-month immersion test (54 coupons, two per test) of E-Z Poxy, MGS and Jeffco epoxies in 100LL and
      8.4 percent ethanol mogas, none showed visible deterioration; all gained some weight, and post-cure mattered more than
      brand. Small sample, not a long-term or maker rating
    cite: kitplanes-tank-epoxy-2018:p1
  why: 'kept: the common automotive fuel, but ethanol can partly dissolve some composite-tank resins (judgment: the book''s
    tank resin is not shown safe), so this path needs a tank resin that is shown to hold up, with a good post-cure (the rehearsal
    player carries an open placeholder for it); vapor lock in a hot pusher engine bay is a further judgment-level concern
    with no source here'
