rotax-915is:
  installed_lb:
    v: 201.1
    flag: derived
    cite: easa-tcds-e121:p13
    note: 'Build-up on a similar basis to the 912 iS: 84.6 kg dry (EASA data sheet, 915 iSc2 A: base engine, gearbox, turbo,
      intercooler, exhaust, ECU, fusebox, wiring, oil tank, cooling baffle; no fuel pumps, radiator or oil cooler) plus engine
      suspension frame 2.0 kg, external alternator 3.0 kg and fuel pumps 1.6 kg from the maker product page (rotax-915is-page:p1)
      = 91.2 kg. Coolant, radiator and oil cooler are not included (unknown). The 82.2 kg product-page figure uses a smaller
      include list.'
  cg_arm_in:
    v: 141.05
    flag: derived
    note: assumed same installed CG as the book engine
  cruise_ff_gph:
    v: 5.92
    flag: derived
    cite: rotax-om-915i:p1
    note: Constant-BSFC scale of one manufacturer deck row (5500 rpm, sea level, 87,47 kW, 26,53 kg/h = 303 g/kWh) to the
      52.0 kW mission power, then kg/h to gal/h at the record density of 5.87 lb/gal. The deck prints kg/h only. BSFC is probably
      higher at low power, so this understates the fuel flow.
