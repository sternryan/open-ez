# Material property sets. Units convention for this whole file: psi for moduli and strengths,
# inches for t_ply, lb/ft2 for areal_mass, nu12 dimensionless. Every property is either
# {value, units, cite: <id>:p<page>} or {value (may be null), units, flag: unsourced, note}.
# use: validation = measured values for checking the engine; design-proxy = a stand-in for the
# book material, not the same resin; book = the plans' material; legacy = old unsourced defaults.
materials:
  as4_8552:
    use: validation
    description: Hexcel 8552 AS4 unidirectional prepreg, room-temperature dry, measured means (NCAMP Table
      2-1)
    properties:
      E1:
        value: 19090000.0
        units: psi
        cite: ncamp-8552-as4:p30
        note: tension; normalised 18.46 Msi; compression 16.76 Msi
      E2:
        value: 1340000.0
        units: psi
        cite: ncamp-8552-as4:p30
        note: tension; compression 1.43 Msi
      G12:
        value: 700000.0
        units: psi
        cite: ncamp-8552-as4:p30
      nu12:
        value: 0.302
        units: '1'
        cite: ncamp-8552-as4:p30
      F1t:
        value: 299220
        units: psi
        cite: ncamp-8552-as4:p30
        note: from longitudinal tension; normalised 289.47 ksi
      F1c:
        value: 215290
        units: psi
        cite: ncamp-8552-as4:p30
        note: derived from cross-ply by back-out factor; normalised 202.70 ksi
      F2t:
        value: 9270
        units: psi
        cite: ncamp-8552-as4:p30
      F2c:
        value: 38850
        units: psi
        cite: ncamp-8552-as4:p30
      F6:
        value: 8000
        units: psi
        cite: ncamp-8552-as4:p30
        note: 0.2% offset; value at 5% strain is 13.28 ksi
      t_ply:
        value: 0.0074
        units: in
        cite: ncamp-8552-as4:p30
        note: cured ply thickness, normalising value
      areal_mass:
        value: null
        units: lb/ft2
        flag: unsourced
        note: areal mass not read
