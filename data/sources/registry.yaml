# Every citation in open-ez points at one of these ids. `copy` says what the local copy is;
# `page_basis` says which page numbers citations use. Local copies are private and never committed.
sources:
  om-1980:
    title: Long-EZ Owner's Manual
    edition: RAF Owner's Manual (transcription); includes LPC 116 aft limit 103 (CP 37, 1983), so later than May 1980 first edition; exact revision unconfirmed
    obtain: public transcription in the cobelu/Long-EZ repository ("Owners Manual")
    copy: transcription
    page_basis: printed
    note: printed page numbers are the transcription's; original page numbers differ (e.g. CP 37 cites page 30 for the CG chart)
  plans-1980:
    title: Long-EZ plans, Section I
    edition: March 1980 first edition
    obtain: owner's printed set (phone scan, private)
    copy: scan
    page_basis: pdf
  cp-text:
    title: The Canard Pusher, issues 1-82, sectioned text
    edition: RAF newsletter 1974-1994, community text compilation
    obtain: cozybuilders.org Canard Pusher archive (CPs_1_to_82_Sections.txt)
    copy: transcription
    page_basis: issue
  cobelu:
    title: cobelu/Long-EZ plans transcription
    edition: community markdown transcription of Section I
    obtain: github.com/cobelu/Long-EZ
    copy: transcription
    page_basis: pdf
    note: pages are pages of the per-chapter PDF; the citation context names the chapter (e.g. ch30)
  owner-check:
    title: Owner by-eye reads of the plans scan
    edition: dated per citation
    obtain: recorded in docs/geometry-correction-ledger.md
    copy: owner
    page_basis: pdf
  cp-29:
    title: The Canard Pusher No. 29
    edition: July 1981
    obtain: cozybuilders.org Canard Pusher archive (1981-07_cp-29.pdf)
    copy: ocr
    page_basis: pdf
  cp-31:
    title: The Canard Pusher No. 31
    edition: January 1982
    obtain: cozybuilders.org Canard Pusher archive (1982-01_cp-31.pdf)
    copy: ocr
    page_basis: pdf
  cp-43:
    title: The Canard Pusher No. 43
    edition: January 1985
    obtain: cozybuilders.org Canard Pusher archive (1985-01_cp-43.pdf)
    copy: ocr
    page_basis: pdf
  cp-44:
    title: The Canard Pusher No. 44
    edition: April 1985
    obtain: cozybuilders.org Canard Pusher archive (1985-04_cp-44.pdf)
    copy: ocr
    page_basis: pdf
  wicks-ra5277:
    title: Wicks Aircraft product page, Bidirectional Fiberglass RA5277
    edition: web page read 2026-09-30; lists 38 in wide, 8.8 oz per sq yd, 54 x 48 threads per inch (Hexcel)
    obtain: https://www.wicksaircraft.com/shop/bid-fiberglass-ra5277/
    copy: transcription
    page_basis: pdf
    note: a single web page, cite p1; read and noted, never stored in the repo. The SKU name is the plans' cloth name, so the weight needs no style-number equivalence.
  wicks-ra5177:
    title: Wicks Aircraft product page, Uni Fiberglass RA5177
    edition: web page read 2026-09-30; lists 38 in wide, 7.02 oz per sq yd, 80 x 18 threads per inch (Hexcel)
    obtain: https://www.wicksaircraft.com/shop/uni-fiberglass-ra5177/
    copy: transcription
    page_basis: pdf
    note: a single web page, cite p1; read and noted, never stored in the repo. The SKU name is the plans' cloth name, so the weight needs no style-number equivalence.
  tcds-e223:
    title: FAA Type Certificate Data Sheet E-223, Lycoming O-235 series
    edition: Revision 22, 31 Jan 2020 (FAA DRS); read 2026-10-04
    obtain: FAA Dynamic Regulatory System, TCDS E-223 (public)
    copy: transcription
    page_basis: pdf
    note: NOTE 8 (p7) gives dry weight and the dry CG from the propeller flange front face, including starter and generator. Read and noted, never stored in the repo.
  lyc-om-o235:
    title: Lycoming Operator's Manual 60297-9, O-235 and O-290 series
    edition: 5th edition; public PDF on the maker's site (lycoming.com, file/2025-02, 60297-9)
    obtain: https://www.lycoming.com/sites/default/files/file/2025-02/60297-9%20-%20O-235%20and%20O-290%20Series.pdf
    copy: transcription
    page_basis: printed
    note: Section 1 construction text, p2-6 average engine weights, Figures 7-1 to 7-3 pad labels with no dimensions. Read and noted, never stored in the repo.
  vendor-slick-4300:
    title: Slick 4300 series magneto, vendor catalogue page (08-43720)
    edition: web page; maker's weight claim of 3.75 lb each, read 2026-10-05
    obtain: https://www.aircraftspruce.com/catalog/pnpages/08-43720.php
    copy: transcription
    page_basis: pdf
    note: a single web page, cite p1; vendor relay of the maker's claim, never stored in the repo.
  faa-report-45:
    title: "FAA (CAA) Airframe and Equipment Engineering Report No. 45, Simplified Flutter Prevention Criteria for Personal Type Aircraft"
    edition: R. Rosenbaum, 1955
    obtain: NTIS NTRL accession ADA955270 (DTIC copy), 27 pdf pages
    copy: scan
    page_basis: printed
    note: printed page = pdf page - 1 for pp. 1-10; Figure 2 is printed p10 / pdf p11. Never stored in the repo.
  faa-ac23-629-1b:
    title: "FAA Advisory Circular 23.629-1B, Means of Compliance with 14 CFR Part 23, section 23.629, Flutter"
    edition: 2004-09-28
    obtain: FAA regulatory and guidance library (faa.gov)
    copy: document
    page_basis: pdf
  cfr14-23-629-2011:
    title: 14 CFR 23.629, Flutter
    edition: 2011 edition, GPO govinfo
    obtain: govinfo.gov Code of Federal Regulations, title 14
    copy: document
    page_basis: pdf
  cfr14-23-1505-2011:
    title: 14 CFR 23.1505, Airspeed limitations
    edition: 2011 edition, GPO govinfo
    obtain: govinfo.gov Code of Federal Regulations, title 14
    copy: document
    page_basis: pdf
  ncamp-8552-as4:
    title: "NCAMP Test Report CAM-RP-2010-002 Rev A, Hexcel 8552 AS4 unidirectional prepreg material qualification"
    edition: NIAR Wichita State University, 2011-05-06, 278 pp
    obtain: NCAMP public material database (niar.wichita.edu)
    copy: document
    page_basis: printed
    note: tables 2-1 (p30) and 2-2 (p31) carry the summary properties; layup percentages are 0/+-45/90.
  ncamp-7781-mtm45:
    title: "NCAMP Test Report NCP-RP-2009-009 Rev A, ACG MTM45-1 / 7781 E-glass fabric"
    edition: 2018-09-24, 77 pp
    obtain: NCAMP public material database (niar.wichita.edu)
    copy: document
    page_basis: printed
    note: tables 3-3 (p34) and 3-4 (p35) carry the summary properties.
  agate-wp33-114:
    title: "AGATE-WP3.3-033051-114, BGF 7781 glass / MGS 418 wet layup material properties"
    edition: NIAR, August 2001
    obtain: https://agate.niar.wichita.edu/Materials/WP3.3-033051-114.pdf
    copy: document
    page_basis: printed
    note: resin is MGS 418, not L285; lamina summary table on printed p25.
  agate-wp33-115:
    title: "AGATE-WP3.3-033051-115, Lancair 3K plain-weave carbon / MGS 418 wet layup material properties"
    edition: NIAR, August 2001
    obtain: https://agate.niar.wichita.edu/Materials/WP3.3-033051-115.pdf
    copy: document
    page_basis: printed
    note: resin is MGS 418, not L285; lamina summary table on printed p24.
  kaw-ocw-ch4-laminate:
    title: A. Kaw, Mechanics of Composites open course, Chapter 4 laminate example slides
    edition: University of South Florida open courseware
    obtain: https://kaw.eng.usf.edu/compositesOCW/ppts/chapter4_revised/Chapter4_3_Part04_examplelaminate.pdf
    copy: document
    page_basis: pdf
    note: page = slide number. Follows Kaw, Mechanics of Composite Materials 2nd ed.; book pages not checked.
  kaw-ocw-ch2-tsaiwu:
    title: A. Kaw, Mechanics of Composites open course, Chapter 2 Tsai-Wu failure theory slides
    edition: University of South Florida open courseware
    obtain: https://kaw.eng.usf.edu/compositesOCW/ppts/ (Chapter2_8_6_tsaiwu_failure_theory.pdf)
    copy: document
    page_basis: pdf
    note: page = slide number. Follows Kaw, Mechanics of Composite Materials 2nd ed.; book pages not checked.
  msstate-a610-ex1:
    title: Mississippi State University, Structural Analysis II, section A6.10 Example 1 (two-cell torsion)
    edition: course web page
    obtain: http://ae.msstate.edu/tupas/exp/A6.10_ex1.html
    copy: document
    page_basis: pdf
    note: single web page, cite p1.
  caia-2023-ia100:
    title: "Liberatto, Vianello and Mendez, Aplicacion del criterio simplificado de prevencion de flutter a la estructura y superficies de control de la aeronave IA-100 B/C (paper 7102)"
    edition: 7th Argentine Congress of Aeronautical Engineering (CAIA), 2023, 11 pages
    obtain: conference proceedings site of the Universidad Nacional de La Plata engineering faculty (caia.ing.unlp.edu.ar), paper 7102
    copy: document
    page_basis: pdf
    note: secondary application of FAA Report 45 to the IA-100; the wing station table is p3 (Tabla 2), the aileron table p4 (Tabla 3). Never stored in the repo.
  nasa-tn-d3125:
    title: NASA TN D-3125, Rheinfurth and Swift, A new approach to the explanation of the flutter mechanism
    edition: NASA technical note
    obtain: NASA NTRS 19660006195
    copy: document
    page_basis: printed
  mgs-l285-tds:
    title: MGS/Hexion L285 laminating resin technical data sheet
    edition: vendor sheet (mgs285tech.pdf)
    obtain: Aircraft Spruce catalogue document mgs285tech.pdf
    copy: document
    page_basis: pdf
  hexforce-7715-pds:
    title: HexForce 7715 fabric product data sheet
    edition: vendor sheet (01-00641.pdf)
    obtain: Aircraft Spruce catalogue document 01-00641.pdf
    copy: document
    page_basis: pdf
    note: dry fabric data only; no cured lamina properties.
  incas-stere-2010:
    title: "M. Stere, The torsion of the multicell sections, INCAS Bulletin vol 2 no 3, pp 99-105"
    edition: 2010, DOI 10.13111/2066-8201.2010.2.3.11
    obtain: INCAS Bulletin open-access archive (bulletin.incas.ro), by the DOI
    copy: document
    page_basis: printed
    note: section 5 Example 1 (printed p103 to p104) is a three-cell wing section attributed to Megson 3rd ed.; shear flows printed in daN/cm (equal to N/mm); the printed GJ is a factor 10 off G x J and is not used.
  ulpower-ul350i:
    title: ULPower product page, UL350i
    edition: web page read 2026-10-18; shows 118 hp, ready-to-fly 78.4 kg (173 lb), mogas 95 RON (91 AKI) for serials below 223501 and 91 RON (87 AKI) above, 100LL allowed if mogas is unavailable, estimated cruise fuel about 18 L/h, no ethanol limit stated
    obtain: https://ulpower.com/en/engines/ul350/ul350i
    copy: transcription
    page_basis: pdf
    note: a single web page, cite p1; read and noted, never stored in the repo. No ethanol percentage appears on the page, so the ethanol limit is unknown.
  rotax-912is-om:
    title: Rotax 912 iS operator's manual (D05875), hosted by a third party
    edition: PDF read 2026-10-18; fuel consumption at 75 percent continuous performance is 16.5 L/h (4.3 gal/h), 51.8 kW (69 hp), specific consumption 250 g/kWh
    obtain: https://avsport.org/acft/Rotax/912iS/912iS_operators_manual_d05875.pdf
    copy: transcription
    page_basis: pdf
    note: cite p1 as the document; the figure was found by text search, not by page. Read and noted, never stored in the repo.
  rotax-912is-datasheet:
    title: Rotax 912 iS / iSc Sport aircraft engine datasheet
    edition: PDF read 2026-10-18; 63.6 kg (140.2 lb) with gearbox i=2.43 and overload clutch; exhaust 4.8 kg, mount frame 2.0 kg, external alternator 3.0 kg, air guide 0.4 kg, fuel pumps 1.6 kg
    obtain: https://www.flyrotax.com/assets/files/products/Datasheet-Aircraft-Engine-912-iS-iSc-Sport.pdf
    copy: transcription
    page_basis: pdf
    note: cite p1; read and noted, never stored in the repo. Coolant and radiator weight are not in the datasheet.
  rotax-fuel-si:
    title: Rotax service instruction on operating fluids (UL91 note), hosted by a flying club
    edition: PDF read 2026-10-18; fuels containing more than 10 percent ethanol are not permitted
    obtain: https://arvikaflygklubb.se/onewebmedia/UL91%20Rotax%20v%C3%A4tskor.pdf
    copy: transcription
    page_basis: pdf
    note: cite p1; read and noted, never stored in the repo.
  deltahawk-spec-2025:
    title: DeltaHawk DHK180 spec sheet, April 2025
    edition: PDF read 2026-10-18; estimated weight 335 lb (151 kg) including starter, alternator, turbo and exhaust
    obtain: https://www.deltahawk.com/wp-content/uploads/2025/04/SpecSheetBack-April2025.pdf
    copy: transcription
    page_basis: pdf
    note: cite p1; the PDF text layer is letter-spaced, so the figure was read after removing the spaces. Read and noted, never stored in the repo.
  swift-ul94-faq:
    title: Swift Fuels FAQ, UL94
    edition: web page read 2026-10-18; UL94 weighs 5.87 lb/gal and is rated an ethanol-free super-premium autogasoline
    obtain: https://www.swiftfuelsavgas.com/faq
    copy: transcription
    page_basis: pdf
    note: a single web page, cite p1; read and noted, never stored in the repo. A vendor statement, not a lab report. No soak test on Long-EZ epoxy tanks is given.
  bmaa-sb2695:
    title: BMAA Technical Information Leaflet / Safety Bulletin 2695, ethanol in composite fuel tanks
    edition: PDF dated 16 Apr 2018, read 2026-10-18; many resins used in composite fuel tanks are partially dissolved by ethanol
    obtain: https://www.bmaa.org/files/oa_sb_2695.pdf
    copy: transcription
    page_basis: pdf
    note: cite p1; read and noted, never stored in the repo.
  kitplanes-tank-epoxy-2018:
    title: Kitplanes, Rapid Prototyping and Experimental Design, epoxy fuel resistance coupon test
    edition: web article read 2026-10-18; three epoxies (E-Z Poxy E-Z 10 with E-Z 87, MGS 285/287, Jeffco 1307/3176), three post-cure treatments, three liquids (100LL, 93 octane E10 with 8.4 percent ethanol measured, acetone); 54 coupons, two per test, 18 months; none of the coupons in 100LL or E10 showed visible deterioration, all gained some weight (least in avgas, less with warmer post-cure), acetone coupons degraded slight to severe; post-cure mattered more than brand
    obtain: https://www.kitplanes.com/rapid-prototyping-and-experimental-design-17/
    copy: transcription
    page_basis: pdf
    note: cite p1; a builder's test with n=2 per cell, not a manufacturer rating and not a long-term result. Read and noted, never stored in the repo.
  wired-yates-2013:
    title: Wired, Chip Yates electric Long-EZ record flights (July 2013)
    edition: web article read 2026-10-18; EnerDel pack, 450 V, 80 amp-hour, 525 lb, takes up the entire back seat
    obtain: https://www.wired.com/2013/07/yates-250mph-electric/
    copy: transcription
    page_basis: pdf
    note: cite p1; read and noted, never stored in the repo.
  amprius-sicore500:
    title: Amprius press release, SiCore 500 cells (2 Sep 2026)
    edition: web page read 2026-10-18; claims a 500 Wh/kg cell at 1C continuous discharge, company claim
    obtain: https://ir.amprius.com/news-events/press-releases/detail/174/amprius-introduces-sicore500-high-energy-density-cells-for-unmanned-aviation
    copy: transcription
    page_basis: pdf
    note: cite p1; a cell figure and a company claim, not a pack figure. Read and noted, never stored in the repo.
  rotax-916is-page:
    title: Rotax 916 iS product page
    edition: web page read 2026-10-18; 160 hp, 85.8 kg (189 lb) with gearbox i=2.54, overload clutch, turbocharger, intercooler and exhaust
    obtain: https://www.flyrotax.com/products/916-is-c
    copy: transcription
    page_basis: pdf
    note: a single web page, cite p1; read and noted, never stored in the repo. No fuel consumption is given.
  rotax-915is-card:
    title: Rotax 912 iS Sport / 915 iS limited edition specification card
    edition: PDF read 2026-10-18; 915 iS 141 hp for 5 min, 82.2 kg (181.2 lb) with gearbox i=2.43, turbo, intercooler and exhaust
    obtain: https://www.rotax-owner.com/en/support-topmenu/technical-information/rotax-engine-specifications/26-rotax-912-is-sport-915-is-limited-edition/file
    copy: transcription
    page_basis: pdf
    note: cite p1; read and noted, never stored in the repo. An older limited-edition card; the later 24 V brochure gives 83.3 kg.
  ulpower-techdata:
    title: ULPower technical data, document M0510 Rev 5 (22 Mar 2024)
    edition: PDF read 2026-10-18; possible fully operational weight UL350i / UL350iS 79.5 kg (175 lb)
    obtain: https://ulpower.com/content/1-engines/5-manuals/technical-data-2023-rev-5.pdf
    copy: transcription
    page_basis: pdf
    note: cite p1; read and noted, never stored in the repo. Operational weight includes coils, ECU, exhaust, pumps, filters and oil; oil cooler and gauges are extra.
