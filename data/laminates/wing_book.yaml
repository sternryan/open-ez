# Wing and aileron laminate schedule as printed in the book chapter 19 (Wings and Ailerons).
# Every ply group carries exactly one of: cite (a registry page) or flag.
# angle_status / extent_status say whether the angle and the BL extent were printed
# (printed) or are open (unsourced | conflict); an open one is null here, never guessed.
reread: done      # captain re-read 2026-10-08 (see reread_log)
part: wing
chapter: 19
variant: book
frame: "spanwise axis = BL (right wing, positive; left wing is the mirror); angle 0 = spanwise. Book angles are 'at 45 degrees' on the wing, taken as relative to the spanwise axis; crossed pairs are written [45, -45]. An angle pair on UND with count 2 is one ply at each angle; an angle pair on BID is the cloth's two fibre directions in one ply. Ply extents given as 'N in from the tip' are converted with tip BL 157 (see geometry wing_tip_bl); spar cap extents are the printed start offset from BL 23 plus the printed cut length."
units: in
sources: >
  cobelu transcription, chapter 19 (per-chapter pdf pages, cite form `cobelu:p<n> ch19`).
  Cloth ids are defined in data/materials.yaml. The book's UND tape for caps is stood in by
  und_7715_wet; BID by bid_7725_wet. Aileron skins are the wing skins cut free (no separate
  skin plies). Plan-view numbers are read from Figure 19-49 (pdf p32).

