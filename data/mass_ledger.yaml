# Mass/CG ledger. Block 1: the empty aircraft is one row (Block 2 decomposes it).
# Page numbers are the transcription's printed pages (see data/sources/registry.yaml om-1980 note).
empty: {weight_lb: 730, arm_in: 111.7, cite: "om-1980:p25 sample empty aircraft 730 at 111.7"}
loads:
  oil:       {arm_in: 140.0, cite: "om-1980:p25 oil row station 140"}
  fuel:      {arm_in: 104.5, cite: "om-1980:p26 fuel rows station 104.5"}
  pilot:     {arm_in: 59.0,  cite: "om-1980:p25 pilot moment = weight x 59"}
  passenger: {arm_in: 103.0, cite: "om-1980:p25 passenger moment = weight x 103"}
  baggage:   {arm_in: 90.0,  cite: "om-1980:p26 baggage row station 90"}
envelope: {fwd_fs: 97.0, aft_fs: 103.0, max_lb: 1325, takeoff_only_max_lb: 1425,
           cite: "om-1980:p28 weight and CG chart (read from the image)",
           placard_cite: "om-1980:p23 CG limits fwd 97.0 aft 103.0",
           max_cite: "om-1980:p4 max takeoff gross 1325"}
samples:
  light_pilot: {items: {oil: 8, fuel: 240, pilot: 135}, book_total_lb: 1113, book_cg_in: 103.96,
                cite: "om-1980:p26 sample loadings table (rows start p25)"}
  heavy_pilot: {items: {oil: 8, fuel: 150, pilot: 210, passenger: 210, baggage: 15},
                book_total_lb: 1323, book_cg_in: 101.06,
                cite: "om-1980:p26 sample loadings table (rows start p25)"}
errata:
  - {what: "light_pilot pilot moment", book: 7865, computed: 7965, cite: "om-1980:p26"}
  - {what: "heavy_pilot total moment", book: 122706, computed: 133706, cite: "om-1980:p26",
     note: "the printed CG 101.06 matches the computed moment, so the total is a typo"}
  - {what: "light_pilot total moment", book: 115708, computed: 115706, cite: "om-1980:p26",
     note: "the p25 prose prints 115706"}
  - {what: "light_pilot CG divisor in prose", book: 11133, computed: 1113, cite: "om-1980:p25"}

# Block 2 M2.2 Task 4: sourced constants for the fuselage-box mass rows (core/ledger.py fuselage_ledger).
# Every value carries a cite; a missing value means "not yet computed", never a guess.
materials:
  cloth:
    BID:
      areal_oz_yd2: 8.8
      cite: "wicks-ra5277:p1 distributor page for RA5277, 8.8 oz per sq yd, 38 in wide"
    UND:
      areal_oz_yd2: 7.02
      cite: "wicks-ra5177:p1 distributor page for RA5177, 7.02 oz per sq yd, 38 in wide"
  resin_to_cloth_weight:
    value: 0.5
    cite: "plans-1980:p21 an excellent layup has resin weight about half the cloth weight (best-case target)"
  foam_lb_ft3:
    R45:
      value: 3.0
      cite: "cp-text:p34 CP34 foam-substitutes table, type R45 at 3 lb per cubic foot"
    R250:
      value: 16.0
      cite: "cp-text:p34 CP34 foam-substitutes table, type R250 at 16 lb per cubic foot"
  part_core:
    side_left: {material: R45, cite: "plans-1980:p36 sides cut from type 45 PV core"}
    side_right: {material: R45, cite: "plans-1980:p36 sides cut from type 45 PV core"}
    front_seat_bkhd: {material: R45, cite: "plans-1980:p33 0.8 thick type R45 block"}
    rear_seat_bkhd: {material: R45, cite: "plans-1980:p34 thick blue foam, type R45 (p9 materials list)"}
    bottom: {material: R45, cite: "plans-1980:p42 1.6 thick R45 block"}
    f22: {material: R250, cite: "plans-1980:p34 panel, F22 and F28 from 0.2 thick dark red R250 (p9 list)"}
    f28: {material: R250, cite: "plans-1980:p34 panel, F22 and F28 from 0.2 thick dark red R250 (p9 list)"}
    panel: {material: R250, cite: "plans-1980:p34 panel, F22 and F28 from 0.2 thick dark red R250 (p9 list)"}
    firewall: {material: birch_plywood, cite: "plans-1980:p35 quarter-inch birch plywood; no density source yet"}
    rollover: {material: R45, cite: "plans-1980:p47 roll-over box from 0.35 thick R45 PV foam"}
    rollover_inserts: {material: birch_plywood, cite: "plans-1980:p48 1/4 plywood inserts; no density source yet"}
    step: {material: aluminium_2024_T3, cite: "plans-1980:p49 1/8 2024-T3 aluminium plate; no density source yet"}

# Block 2 M2.3 Task 4: the retired 45 lb landing-gear lump, decomposed (core/ledger.py gear_rows).
# status: book = a printed weight; unsourced = no source (stays in the physics empty weight, flagged).
# arm_status: book | approximate (arm is a stand-in for a CG the book does not print) | conflict | unsourced.
gear:
  retired_lump: {weight_lb: 45.0, arm_in: 84.5, note: "landing_gear_weight_lb / landing_gear_arm_in, unsourced; removed from config"}
  rows:
    - name: main_strut
      label: "Main gear strut"
      weight_lb: 22.0
      arm_in: 110.5
      status: book
      arm_status: approximate
      cite: ["plans-1980:p50 Long-EZ gear weighs 22 lb", "plans-1980:p8 MG-1L main gear strut 22-lb S-glass"]
      note: "one piece, both legs. Arm is the axle station (p50, p171); strut CG not printed, a bow's CG sits above and maybe forward of the axle"
    - name: nose_strut
      label: "Nose gear strut"
      weight_lb: 2.8
      arm_in: 17.0
      status: book
      arm_status: conflict
      cite: ["plans-1980:p8 NG-1L nose gear strut 2.8 lb S-glass", "plans-1980:p171 nose wheel F.S. 17"]
      note: "weight is book; station conflicts: p171 prints F.S. 17, the Owner's Manual says about 20 (fs_nose_wheel); nose gear is chapter 13. CP23 page 2 gives 2.6 lb for the RAF-made part; the scan's 2.8 is kept until the part is weighed"
    - name: wheels_brakes_tyres_axles
      label: "Wheels and brakes (unsourced)"
      weight_lb: 20.2
      arm_in: 110.5
      status: unsourced
      arm_status: unsourced
      cite: []
      note: "the remainder of the retired 45 lb lump (45 - 22 - 2.8); no source for the weight or the arm; placed at the main axle station only so the empty weight does not silently drop"
  # M2.4 Task 4: the nose-wheel arm is a conflict PAIR (p171 F.S. 17, Owner's Manual about 20). The nose_strut row keeps 17
  # (so no sum moves); the pair is carried here and read out beside the row. No mass is added.
  nose_arm_candidates:
    values_in: [17.0, 20.0]
    status: conflict
    cite: ["plans-1980:p171 nose wheel F.S. 17", "om-1980:p35 nose arm about 20"]
    note: "fs_nose_wheel and fs_nose_wheel_manual; unresolved without the A6/A7 side view; every nose part's mass stays unsourced"

# Block 2 M2.4 Task 1: prototype weights as cited REFERENCE values. They are never added to any sum:
# the computed core-plus-glass rows in `materials` stay the model's masses. page_basis: issue (cp-text),
# printed page 2 of CP26.
prototype_weights:
  rows:
    f22:   {weight_lb: 1.44, cite: "cp-text:p26 CP26 page 2 F22 bulkhead 1 lb 7 oz", note: "prototype, uncured finish"}
    f28:   {weight_lb: 0.19, cite: "cp-text:p26 CP26 page 2 F28 bulkhead 3 oz", note: "prototype, uncured finish"}
    panel: {weight_lb: 2.13, cite: "cp-text:p26 CP26 page 2 instrument panel 2 lb 2 oz", note: "prototype, uncured finish"}
    # Block 2 M2.5 Task 1: centre-section spar, a prototype weight only. No sourced CG, so it is in no moment sum
    # (fuselage_cg matches rows by fuselage part name and there is no `spar` part); the overall CG stays "not yet computed".
    spar:  {weight_lb: 29.3, cite: "cp-text:p26 CP26 page 2 centre-section spar 29 lb 5 oz", note: "prototype, BID layup of layups 5, 6 and 8; the UND option saves about 3.5 lb (CP25 LPC 26), derived about 25.8 lb; reference only, no CG, not a ledger row"}
  complete_fuselage_lb:
    weight_lb: 183.0
    cite: "cp-text:p26 CP26 page 2 complete fuselage with center section and gear, no strakes, canard, canopy or engine mount"
    note: "reference only, for the later ledger-closure test; not used in any sum"
